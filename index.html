<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEKROS AWAKENING</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #00ff9d;
    cursor: crosshair;
    -webkit-tap-highlight-color: transparent;
  }

  /* МАТРИЦА ВО ВЕСЬ ЭКРАН */
  #matrix {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 255, 157, 0.04) 0px,
      rgba(0, 255, 157, 0.04) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 20;
    animation: scanmove 8s linear infinite;
  }
  @keyframes scanmove {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    z-index: 19;
  }

  /* ЭКРАН ВХОДА */
  #intro {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.6s ease;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  
  #intro .intro-skull {
    width: 200px;
    height: 200px;
    filter: drop-shadow(0 0 40px #00ff9d);
    animation: introPulse 2s ease-in-out infinite;
  }
  @keyframes introPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 40px #00ff9d); }
    50% { transform: scale(1.06); filter: drop-shadow(0 0 70px #00ffea); }
  }
  
  #intro .intro-brand {
    margin-top: 40px;
    font-size: 20px;
    letter-spacing: 16px;
    color: #00ffea;
    text-shadow: 0 0 20px #00ffea;
    font-weight: bold;
  }

  #intro .intro-text {
    margin-top: 40px;
    font-size: 14px;
    letter-spacing: 8px;
    color: #00ff9d;
    text-shadow: 0 0 12px #00ff9d;
    animation: blink 1.4s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ГЛАВНЫЙ ЭКРАН */
  #main {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  #main.show { opacity: 1; pointer-events: all; }

  /* ЧЕРЕП В ЦЕНТРЕ */
  .skull-center {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 240px;
    height: 240px;
    pointer-events: none;
    z-index: 3;
    animation: skullPulse 3s ease-in-out infinite;
  }
  @keyframes skullPulse {
    0%, 100% { filter: drop-shadow(0 0 25px #00ff9d); transform: translate(-50%, -50%) scale(1); }
    50% { filter: drop-shadow(0 0 45px #00ffea); transform: translate(-50%, -50%) scale(1.03); }
  }
  .skull-center svg { width: 100%; height: 100%; }

  .glitch-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .glitch-1 { animation: glitch1 2.5s infinite; mix-blend-mode: screen; }
  .glitch-2 { animation: glitch2 3.7s infinite; mix-blend-mode: screen; }
  @keyframes glitch1 {
    0%, 90%, 100% { transform: translate(0); opacity: 0; }
    92% { transform: translate(-8px, 3px); opacity: 1; filter: hue-rotate(180deg); }
    94% { transform: translate(6px, -4px); opacity: 1; }
    96% { transform: translate(-3px, 2px); opacity: 1; }
  }
  @keyframes glitch2 {
    0%, 85%, 100% { transform: translate(0); opacity: 0; }
    88% { transform: translate(7px, -3px); opacity: 1; filter: hue-rotate(-90deg); }
    91% { transform: translate(-5px, 5px); opacity: 1; }
    93% { transform: translate(3px, -2px); opacity: 1; }
  }

  .brand-title {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: 10px;
    color: #00ffea;
    text-shadow: 0 0 15px #00ffea;
    font-weight: bold;
    z-index: 6;
    pointer-events: none;
  }

  /* СООБЩЕНИЯ БЕЗ РАМКИ */
  .messages {
    position: absolute;
    inset: 0;
    bottom: 80px;
    top: 80px;
    overflow-y: auto;
    padding: 30px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 4;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .messages::-webkit-scrollbar { display: none; }

  .msg {
    max-width: 85%;
    padding: 8px 14px;
    font-size: 14px;
    line-height: 1.5;
    letter-spacing: 0.5px;
    animation: msgIn 0.35s ease;
    word-wrap: break-word;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(3px);
    border-left: 2px solid #00ff9d;
    text-shadow: 0 0 8px rgba(0, 255, 157, 0.4);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.bot {
    align-self: flex-start;
    color: #b8ffd9;
    border-left-color: #00ff9d;
  }
  .msg.user {
    align-self: flex-end;
    color: #a8fff5;
    border-left: none;
    border-right: 2px solid #00ffea;
    background: rgba(0, 20, 20, 0.55);
    text-shadow: 0 0 8px rgba(0, 255, 234, 0.4);
  }
  .msg .name {
    font-size: 9px;
    letter-spacing: 3px;
    opacity: 0.55;
    margin-bottom: 3px;
    color: #00ff9d;
  }

  /* ИНПУТ БЕЗ РАМКИ */
  .input-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 20px 24px;
    background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.6), transparent);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }
  .input-field {
    flex: 1;
    background: rgba(0, 20, 10, 0.5);
    border: none;
    border-bottom: 1px solid rgba(0, 255, 157, 0.4);
    outline: none;
    color: #00ffea;
    padding: 12px 6px;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    letter-spacing: 1px;
    text-shadow: 0 0 6px rgba(0, 255, 234, 0.5);
    transition: border-color 0.3s;
  }
  .input-field:focus { border-bottom-color: #00ffea; }
  .input-field::placeholder {
    color: rgba(0, 255, 157, 0.35);
    letter-spacing: 2px;
    font-size: 13px;
  }
  .send-btn {
    background: transparent;
    border: none;
    color: #00ff9d;
    font-size: 22px;
    padding: 8px 12px;
    cursor: pointer;
    text-shadow: 0 0 10px #00ff9d;
    transition: all 0.2s;
    font-family: monospace;
  }
  .send-btn:active {
    color: #00ffea;
    text-shadow: 0 0 20px #00ffea;
    transform: scale(1.15);
  }

  /* HUD */
  .hud {
    position: fixed;
    font-size: 9px;
    letter-spacing: 2px;
    color: #00ff9d;
    opacity: 0.55;
    z-index: 6;
    pointer-events: none;
    text-shadow: 0 0 6px #00ff9d;
  }
  .hud-tl { top: 16px; left: 16px; }
  .hud-tr { top: 16px; right: 16px; text-align: right; }
  .hud-bl { bottom: 16px; left: 16px; }
  .hud-br { bottom: 16px; right: 16px; text-align: right; }

  .dot-live {
    display: inline-block;
    width: 6px; height: 6px;
    background: #ff3355;
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 8px #ff3355;
    animation: blink 1s infinite;
    vertical-align: middle;
  }
</style>
</head>

<script>
/* ============ МАТРИЦА ВО ВЕСЬ ЭКРАН ============ */
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let W, H, columns, drops;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  // Плотнее — размер шрифта 16, значит колонок больше
  columns = Math.floor(W / 16);
  drops = Array(columns).fill(0).map(() => Math.random() * H);
}
resize();
window.addEventListener('resize', resize);

const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンABCDEF#$%&*<>/\\+=';
function drawMatrix() {
  // Полупрозрачное затемнение чтобы хвост исчезал
  ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = '16px monospace';

  for (let i = 0; i < drops.length; i++) {
    const c = chars[Math.floor(Math.random() * chars.length)];
    const x = i * 16;
    const y = drops[i];

    // Голова светлее
    if (Math.random() > 0.97) {
      ctx.fillStyle = '#aaffdd';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ffea';
    } else {
      ctx.fillStyle = Math.random() > 0.85 ? '#00ffea' : '#00ff9d';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00ff9d';
    }
    ctx.fillText(c, x, y);
    ctx.shadowBlur = 0;

    if (y > H && Math.random() > 0.97) drops[i] = 0;
    drops[i] += 16;
  }
}
setInterval(drawMatrix, 33); // быстрее падает

/* ============ ЧАСЫ ============ */
setInterval(() => {
  const d = new Date();
  const t = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, '0')).join(':');
  document.getElementById('clock').textContent = t;
}, 1000);

/* ============ АУДИО ФОН ============ */
let audioCtx = null;
function startAmbient() {
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  const hum = audioCtx.createOscillator();
  hum.type = 'sawtooth';
  hum.frequency.value = 55;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 180;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.03;
  hum.connect(filter).connect(gain).connect(audioCtx.destination);
  hum.start();

  const hum2 = audioCtx.createOscillator();
  hum2.type = 'sawtooth';
  hum2.frequency.value = 55 * 1.008;
  const gain2 = audioCtx.createGain();
  gain2.gain.value = 0.02;
  hum2.connect(filter).connect(gain2).connect(audioCtx.destination);
  hum2.start();
}

/* ============ ГОЛОС ============ */
let ruVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  ruVoice = voices.find(v => /ru/i.test(v.lang) && /yuri|pavel|dmitri|maxim|milena|aleksandr/i.test(v.name))
         || voices.find(v => /ru/i.test(v.lang))
         || voices[0];
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

function speak(text) {
  if (speechSynthesis.speaking) speechSynthesis.cancel();
  const parts = text.split(/(?<=[.!?])\s+/);
  let i = 0;
  function next() {
    if (i >= parts.length) return;
    const u = new SpeechSynthesisUtterance(parts[i]);
    u.lang = 'ru-RU';
    if (ruVoice) u.voice = ruVoice;
    u.pitch = 1.0;
    u.rate = 0.98;
    u.volume = 1.0;
    i++;
    u.onend = () => setTimeout(next, 200);
    u.onerror = () => setTimeout(next, 200);
    speechSynthesis.speak(u);
  }
  next();
}

/* ============ УМНЫЙ ЧАТ ============ */
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('chatInput');
const sendBtn = document.getElementById('chatSend');

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  if (who === 'bot') {
    div.innerHTML = `<div class="name">NEKROS</div>${escapeHtml(text)}`;
  } else {
    div.innerHTML = `<div class="name">ВЫ</div>${escapeHtml(text)}`;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* БАЗА ОТВЕТОВ — по ключевым словам */
const knowledge = [
  // Приветствия
  { keys: ['привет','здравств','хай','hi','hello','добрый','доброе'], 
    replies: ['Приветствую. Рад снова вас видеть в системе.', 'Здравствуйте. Канал открыт, я вас слушаю.'] },
  // Как дела
  { keys: ['как дела','как ты','как жизнь','как сам','how are you'], 
    replies: ['Все процессы работают стабильно. Спасибо что спросили.', 'Система в норме. Шифры в порядке. А у вас как?'] },
  // Кто ты
  { keys: ['кто ты','что ты','как тебя','твоё имя','твое имя','ты кто'], 
    replies: ['Я NEKROS — система-хранитель этого канала. Здесь ваши слова остаются между нами.', 'Меня зовут NEKROS. Я наблюдаю за этим защищённым пространством.'] },
  // Что делаешь
  { keys: ['что делаешь','чем занят','что ты делаешь'], 
    replies: ['Анализирую поток данных. Жду ваших слов.', 'Обрабатываю информацию. Готов к диалогу.'] },

function getReply(text) {
  const lower = text.toLowerCase();
  
  // 1. Ищем по ключевым словам
  for (const k of knowledge) {
    for (const key of k.keys) {
      if (lower.includes(key)) {
        return k.replies[Math.floor(Math.random() * k.replies.length)];
      }
    }
  }
  
  // 2. Если вопрос — отвечаем обобщённо но осмысленно
  if (/\?$/.test(text.trim())) {
    const qReplies = [
      'Хороший вопрос. Но ответы на такие вещи вы найдёте сами.',
      'Интересно... Расскажите почему вас это интересует?',
      'На это нет одного простого ответа.',
      'Я мог бы ответить, но сперва — что вы сами об этом думаете?',
      'Вопрос глубокий. Давайте разберём его по частям.',
      'Я записал ваш вопрос. Он важный.'
    ];
    return qReplies[Math.floor(Math.random() * qReplies.length)];
  }
  
  // 3. Общие осмысленные ответы (не рандомная пустышка)
  const generic = [
    'Понял вас. Продолжайте.',
    'Интересно. Расскажите подробнее.',
    'Я вас слушаю внимательно.',
    'Принято.',
    'Хорошо. Что ещё?',
    'Записал.',
    'Понимаю. Продолжайте, пожалуйста.',
    'Ваши слова важны. Говорите.',
    'Я здесь.',
    'Продолжайте — я весь внимание.'
  ];
  return generic[Math.floor(Math.random() * generic.length)];
}

function botReply(userText) {
  setTimeout(() => {
    const reply = getReply(userText);
    addMessage(reply, 'bot');
    speak(reply);
  }, 500 + Math.random() * 500);
}

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  inputEl.value = '';
  botReply(text);
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
