<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sunset Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ ЗАКАТ ============ */
  .sunset-bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(180deg,
      #0a0616 0%,
      #2d1b4e 15%,
      #6b2d5c 30%,
      #b8456b 45%,
      #e86a4a 60%,
      #ff9a56 72%,
      #ffc46b 82%,
      #ffd97d 90%,
      #ffe89d 100%
    );
    overflow: hidden;
  }
  /* Солнце */
  .sun {
    position: absolute;
    bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 220px;
    background: radial-gradient(circle,
      #fff8d0 0%,
      #ffe66d 20%,
      #ffb347 45%,
      #ff6b35 70%,
      transparent 80%
    );
    border-radius: 50%;
    filter: blur(2px);
    box-shadow:
      0 0 60px 20px rgba(255, 180, 80, 0.7),
      0 0 120px 60px rgba(255, 120, 60, 0.4);
    animation: sunGlow 4s ease-in-out infinite;
  }
  @keyframes sunGlow {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.05); opacity: 0.95; }
  }
  /* Облака */
  .cloud {
    position: absolute;
    background: linear-gradient(180deg, rgba(255,180,150,0.6), rgba(255,220,180,0.3));
    border-radius: 100px;
    filter: blur(20px);
    animation: cloudMove 40s linear infinite;
  }
  .cloud1 { width: 400px; height: 80px; top: 25%; left: -20%; animation-duration: 60s; }
  .cloud2 { width: 300px; height: 60px; top: 35%; left: -40%; animation-duration: 80s; animation-delay: -20s; opacity: 0.7; }
  .cloud3 { width: 500px; height: 90px; top: 15%; left: -30%; animation-duration: 70s; animation-delay: -40s; opacity: 0.5; }
  .cloud4 { width: 350px; height: 70px; top: 45%; left: -50%; animation-duration: 90s; animation-delay: -10s; opacity: 0.4; }
  @keyframes cloudMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(150vw); }
  }
  /* Звёзды сверху */
  .stars {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 40%;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 80% 25%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 35% 8%, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 90% 40%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 50% 35%, rgba(255,255,255,0.7), transparent);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 0.5; }
  }

  /* ============ РЕГИСТРАЦИЯ ============ */
  #register {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    transition: opacity 0.5s ease;
  }
  #register.hide { opacity: 0; pointer-events: none; }
  .reg-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 24px;
    padding: 32px 24px;
    width: 100%;
    max-width: 380px;
    color: #fff;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .reg-card h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .reg-card p {
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 28px;
  }
  .avatar-preview {
    width: 100px; height: 100px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: transform 0.2s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    border: 3px solid rgba(255,255,255,0.4);
  }
  .avatar-preview:active { transform: scale(0.95); }

  .reg-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 16px;
    color: #fff;
    outline: none;
    margin-bottom: 16px;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .reg-input::placeholder { color: rgba(255,255,255,0.5); }
  .reg-input:focus {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.5);
  }
  .reg-btn {
    width: 100%;
    background: linear-gradient(135deg, #ff8c42, #ff5e62);
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 8px 24px rgba(255, 100, 80, 0.4);
    font-family: inherit;
  }
  .reg-btn:active { transform: scale(0.97); }
  .reg-btn:disabled { opacity: 0.5; }

  /* ============ ГЛАВНЫЙ ЭКРАН ============ */
  #app {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #app.show { opacity: 1; pointer-events: all; }

  /* Хедер */
  .header {
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    color: #fff;
    background: rgba(0,0,0,0.15);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .header-left {
    display: flex; align-items: center; gap: 12px;
  }
  .my-avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
    color: #fff;
    border: 2px solid rgba(255,255,255,0.4);
  }
  .my-name {
    font-size: 17px; font-weight: 600;
  }
  .my-status {
    font-size: 12px; opacity: 0.75;
    margin-top: 2px;
  }
  .settings-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    width: 40px; height: 40px;
    border-radius: 50%;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .settings-btn:active { background: rgba(255,255,255,0.25); }

  /* Поиск */
  .search-wrap {
    padding: 12px 20px;
    background: rgba(0,0,0,0.1);
    backdrop-filter: blur(20px);
  }
  .search-box {
    position: relative;
    display: flex; align-items: center;
  }
  .search-box svg {
    position: absolute;
    left: 14px;
    width: 18px; height: 18px;
    fill: rgba(255,255,255,0.6);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 12px 16px 12px 42px;
    font-size: 15px;
    color: #fff;
    outline: none;
    font-family: inherit;
    transition: all 0.2s;
  }
  .search-input::placeholder { color: rgba(255,255,255,0.55); }
  .search-input:focus {
    background: rgba(255,255,255,0.22);
    border-color: rgba(255,255,255,0.4);
  }

  /* Список контактов */
  .contacts {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 100px;
    scrollbar-width: none;
  }
  .contacts::-webkit-scrollbar { display: none; }
  .contact {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    border-radius: 16px;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 4px;
    background: rgba(255,255,255,0.05);
  }
  .contact:active { background: rgba(255,255,255,0.15); }
  .contact-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    position: relative;
  }
  .online-dot {
    position: absolute;
    bottom: 2px; right: 2px;
    width: 12px; height: 12px;
    background: #4ade80;
    border-radius: 50%;
    border: 2px solid rgba(30,20,50,0.9);
    box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
  }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name {
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .contact-last {
    color: rgba(255,255,255,0.65);
    font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .contact-time {
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    flex-shrink: 0;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255,255,255,0.6);
  }
  .empty-state .emoji {
    font-size: 60px;
    margin-bottom: 16px;
    opacity: 0.5;
  }
  .empty-state p { font-size: 15px; }

  /* ============ ЧАТ ============ */
  #chat {
    position: fixed; inset: 0; z-index: 200;
    display: flex; flex-direction: column;
    background: rgba(15, 10, 30, 0.75);
    backdrop-filter: blur(30px);
    transform: translateX(100%);
    transition: transform 0.3s ease;
  }
  #chat.show { transform: translateX(0); }

  .chat-header {
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    color: #fff;
  }
  .back-btn {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 24px;
    padding: 4px 8px;
    cursor: pointer;
    display: flex; align-items: center;
  }
  .chat-header .contact-avatar {
    width: 40px; height: 40px;
    font-size: 16px;
  }
  .chat-title { flex: 1; }
  .chat-title .name { font-size: 16px; font-weight: 600; }
  .chat-title .status { font-size: 12px; opacity: 0.7; margin-top: 1px; }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 90px;
    display: flex; flex-direction: column;
    gap: 8px;
    scrollbar-width: none;
  }
  .chat-body::-webkit-scrollbar { display: none; }

  .message {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
    animation: msgPop 0.25s ease;
    position: relative;
  }
  @keyframes msgPop {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  .message.me {
    align-self: flex-end;
    background: linear-gradient(135deg, #ff8c42, #ff5e62);
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 4px 12px rgba(255, 100, 80, 0.3);
  }
  .message.them {
    align-self: flex-start;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-bottom-left-radius: 6px;
    backdrop-filter: blur(10px);
  }
  .message .time {
    font-size: 10px;
    opacity: 0.7;
    margin-top: 4px;
    text-align: right;
  }

  .chat-input-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 14px 20px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .chat-input {
    flex: 1;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 22px;
    padding: 12px 18px;
    font-size: 15px;
    color: #fff;
    outline: none;
    font-family: inherit;
  }
  .chat-input::placeholder { color: rgba(255,255,255,0.5); }
  .chat-input:focus { background: rgba(255,255,255,0.22); }
  .chat-send {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff8c42, #ff5e62);
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(255, 100, 80, 0.4);
    transition: transform 0.15s;
    flex-shrink: 0;
  }
  .chat-send:active { transform: scale(0.9); }
</style>
</head>

/* ============================================================
   ХРАНИЛИЩЕ
   ============================================================ */
const STORAGE_KEY = 'sunset_chat_user_v1';
const CHATS_KEY = 'sunset_chat_messages_v1';

let currentUser = null;
let chats = {}; // { personId: [{text, time, from: 'me'|'them'}] }
let activePerson = null;

function loadUser() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function saveUser(user) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(user)); } catch(e) {}
}
function loadChats() {
  try {
    const raw = localStorage.getItem(CHATS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveChats() {
  try { localStorage.setItem(CHATS_KEY, JSON.stringify(chats)); } catch(e) {}
}

/* ============================================================
   РЕГИСТРАЦИЯ
   ============================================================ */
const AVATAR_COLORS = ['#ff6b6b', '#a06cd5', '#4a90e2', '#ff5e8c', '#4ecdc4', '#f5a623', '#7b68ee', '#26a69a', '#ba68c8', '#e91e63'];
let chosenColor = AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)];

const avatarPreview = document.getElementById('avatarPreview');
const regName = document.getElementById('regName');
const regBtn = document.getElementById('regBtn');

function updateAvatarPreview() {
  const name = regName.value.trim();
  const letter = name ? name.charAt(0).toUpperCase() : '?';
  avatarPreview.textContent = letter;
  avatarPreview.style.background = chosenColor;
  regBtn.disabled = name.length < 2;
}

avatarPreview.addEventListener('click', () => {
  // Меняем цвет по кругу
  let idx = AVATAR_COLORS.indexOf(chosenColor);
  idx = (idx + 1) % AVATAR_COLORS.length;
  chosenColor = AVATAR_COLORS[idx];
  updateAvatarPreview();
});

regName.addEventListener('input', updateAvatarPreview);
updateAvatarPreview();

regBtn.addEventListener('click', () => {
  const name = regName.value.trim();
  if (name.length < 2) return;
  currentUser = { name: name, color: chosenColor, emoji: name.charAt(0).toUpperCase() };
  saveUser(currentUser);
  startApp();
});

/* ============================================================
   ЗАПУСК
   ============================================================ */
function startApp() {
  document.getElementById('register').classList.add('hide');
  document.getElementById('app').classList.add('show');
  document.getElementById('myAvatarSmall').textContent = currentUser.emoji;
  document.getElementById('myAvatarSmall').style.background = currentUser.color;
  document.getElementById('myNameLabel').textContent = currentUser.name;
  chats = loadChats();
  renderContacts(PEOPLE);
}

/* Автовход если уже зарегистрирован */
const savedUser = loadUser();
if (savedUser) {
  currentUser = savedUser;
  setTimeout(startApp, 200);
}

/* ============================================================
   КОНТАКТЫ
   ============================================================ */
const contactsList = document.getElementById('contactsList');

function renderContacts(list) {
  contactsList.innerHTML = '';

  if (!list.length) {
    contactsList.innerHTML = '<div class="empty-state"><div class="emoji">🔍</div><p>Никого не найдено</p></div>';
    return;
  }

  list.forEach(person => {
    const chat = chats[person.id] || [];
    const last = chat[chat.length - 1];
    const lastText = last ? last.text : 'Нажмите чтобы написать';
    const lastTime = last ? last.time : '';

    const div = document.createElement('div');
    div.className = 'contact';
    div.innerHTML =
      '<div class="contact-avatar" style="background:' + person.color + '">' + person.emoji +
        '<div class="online-dot"></div>' +
      '</div>' +
      '<div class="contact-info">' +
        '<div class="contact-name">' + escapeHtml(person.name) + '</div>' +
        '<div class="contact-last">' + escapeHtml(lastText) + '</div>' +
      '</div>' +
      '<div class="contact-time">' + lastTime + '</div>';
    div.addEventListener('click', () => openChat(person));
    contactsList.appendChild(div);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   ПОИСК
   ============================================================ */
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    renderContacts(PEOPLE);
    return;
  }
  const filtered = PEOPLE.filter(p => p.name.toLowerCase().includes(q));
  renderContacts(filtered);
});

/* ============================================================
   ЧАТ
   ============================================================ */
const chatEl = document.getElementById('chat');
const chatBody = document.getElementById('chatBody');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('chatSend');
const chatName = document.getElementById('chatName');
const chatAvatar = document.getElementById('chatAvatar');

function openChat(person) {
  activePerson = person;
  chatName.textContent = person.name;
  chatAvatar.textContent = person.emoji;
  chatAvatar.style.background = person.color;
  chatEl.classList.add('show');
  renderChat();
  setTimeout(() => chatInput.focus(), 300);
}

function renderChat() {
  if (!activePerson) return;
  const msgs = chats[activePerson.id] || [];
  chatBody.innerHTML = '';
  if (!msgs.length) {
    chatBody.innerHTML = '<div class="empty-state"><div class="emoji">👋</div><p>Начните диалог с ' + escapeHtml(activePerson.name) + '</p></div>';
    return;
  }
  msgs.forEach(m => addMessageToDOM(m));
  chatBody.scrollTop = chatBody.scrollHeight;
}

function addMessageToDOM(msg) {
  const div = document.createElement('div');
  div.className = 'message ' + (msg.from === 'me' ? 'me' : 'them');
  div.innerHTML = escapeHtml(msg.text) + '<div class="time">' + escapeHtml(msg.time) + '</div>';
  chatBody.appendChild(div);
}

function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || !activePerson) return;
  const msg = { text: text, time: nowTime(), from: 'me' };
  if (!chats[activePerson.id]) chats[activePerson.id] = [];
  chats[activePerson.id].push(msg);
  saveChats();
  addMessageToDOM(msg);
  chatInput.value = '';
  chatBody.scrollTop = chatBody.scrollHeight;

  // Авто-ответ собеседника через 1-2 сек
  const person = activePerson;
  setTimeout(() => {
    const replies = person.autoReplies;
    const replyText = replies[Math.floor(Math.random() * replies.length)];
    const replyMsg = { text: replyText, time: nowTime(), from: 'them' };
    if (!chats[person.id]) chats[person.id] = [];
    chats[person.id].push(replyMsg);
    saveChats();
    if (activePerson && activePerson.id === person.id) {
      addMessageToDOM(replyMsg);
      chatBody.scrollTop = chatBody.scrollHeight;
    }
  }, 1000 + Math.random() * 1500);
}

chatSend.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

document.getElementById('backBtn').addEventListener('click', () => {
  chatEl.classList.remove('show');
  activePerson = null;
  renderContacts(PEOPLE);
});

/* ============================================================
   НАСТРОЙКИ (сброс аккаунта)
   ============================================================ */
document.getElementById('settingsBtn').addEventListener('click', () => {
  if (confirm('Выйти из аккаунта? Все настройки сбросятся.')) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(CHATS_KEY);
    location.reload();
  }
});
</script>
</body>
</html>
