<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEKROS AWAKENING</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #00ff9d;
    cursor: crosshair;
  }

  #particles {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 255, 157, 0.03) 0px,
      rgba(0, 255, 157, 0.03) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 10;
    animation: scanmove 8s linear infinite;
  }
  @keyframes scanmove {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.9) 100%);
    pointer-events: none;
    z-index: 9;
  }

  /* ===== ЭКРАН ВХОДА ===== */
  #intro {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.6s ease;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  
  #intro .intro-skull {
    width: 160px;
    height: 160px;
    filter: drop-shadow(0 0 30px #00ff9d);
    animation: introPulse 2s ease-in-out infinite;
  }
  @keyframes introPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 30px #00ff9d); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 55px #00ffea); }
  }
  
  #intro .intro-brand {
    margin-top: 30px;
    font-size: 18px;
    letter-spacing: 14px;
    color: #00ffea;
    text-shadow: 0 0 18px #00ffea;
    font-weight: bold;
  }

  #intro .intro-text {
    margin-top: 36px;
    font-size: 14px;
    letter-spacing: 8px;
    color: #00ff9d;
    text-shadow: 0 0 12px #00ff9d;
    animation: blink 1.4s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ===== ГЛАВНЫЙ ЭКРАН ===== */
  #main {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    padding: 60px 20px 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  #main.show { opacity: 1; pointer-events: all; }

  /* Череп сверху */
  .skull-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
  }
  .skull-small {
    width: 90px;
    height: 90px;
    filter: drop-shadow(0 0 20px #00ff9d);
    animation: pulse 3s ease-in-out infinite;
    position: relative;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px #00ff9d); }
    50% { transform: scale(1.04); filter: drop-shadow(0 0 35px #00ffea); }
  }
  .skull-small svg { width: 100%; height: 100%; }

  .glitch-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .glitch-layer svg { width: 100%; height: 100%; }
  .glitch-1 { animation: glitch1 2.5s infinite; mix-blend-mode: screen; }
  .glitch-2 { animation: glitch2 3.7s infinite; mix-blend-mode: screen; }
  @keyframes glitch1 {
    0%, 90%, 100% { transform: translate(0); opacity: 0; }
    92% { transform: translate(-4px, 2px); opacity: 1; filter: hue-rotate(180deg); }
    94% { transform: translate(3px, -2px); opacity: 1; }
    96% { transform: translate(-2px, 1px); opacity: 1; }
  }
  @keyframes glitch2 {
    0%, 85%, 100% { transform: translate(0); opacity: 0; }
    88% { transform: translate(3px, -2px); opacity: 1; filter: hue-rotate(-90deg); }
    91% { transform: translate(-2px, 3px); opacity: 1; }
    93% { transform: translate(2px, -1px); opacity: 1; }
  }

  .brand {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 8px;
    color: #00ffea;
    text-shadow: 0 0 10px #00ffea;
    opacity: 0.9;
  }

  /* ЧАТ */
  .chat-wrap {
    flex: 1;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(0, 255, 157, 0.3);
    background: rgba(0, 15, 8, 0.6);
    backdrop-filter: blur(4px);
    overflow: hidden;
  }
  .chat-header {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(0, 255, 157, 0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 3px;
    background: rgba(0, 255, 157, 0.04);
  }
  .chat-header .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: #00ff9d;
    border-radius: 50%;
    margin-right: 8px;
    animation: blinkDot 1s infinite;
    box-shadow: 0 0 8px #00ff9d;
  }
  @keyframes blinkDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 13px;
    line-height: 1.5;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(0,255,157,0.3); }

  .msg {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 3px;
    animation: msgIn 0.3s ease;
    word-wrap: break-word;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.bot {
    align-self: flex-start;
    background: rgba(0, 255, 157, 0.08);
    border-left: 2px solid #00ff9d;
    color: #b8ffd9;
  }
  .msg.user {
    align-self: flex-end;
    background: rgba(0, 255, 234, 0.1);
    border-right: 2px solid #00ffea;
    color: #a8fff5;
    text-align: right;
  }
  .msg .name {
    font-size: 9px;
    letter-spacing: 2px;
    opacity: 0.5;
    margin-bottom: 3px;
  }

  .chat-input-wrap {
    display: flex;
    border-top: 1px solid rgba(0, 255, 157, 0.25);
    background: rgba(0, 255, 157, 0.04);
  }
  .chat-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #00ff9d;
    padding: 12px 14px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .chat-input::placeholder { color: rgba(0, 255, 157, 0.35); }
  .chat-send {
    background: transparent;
    border: none;
    color: #00ff9d;
    padding: 0 18px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chat-send:hover { color: #00ffea; text-shadow: 0 0 10px #00ffea; }

  /* HUD */
  .hud {
    position: fixed;
    font-size: 9px;
    letter-spacing: 2px;
    color: #00ff9d;
    opacity: 0.5;
    z-index: 6;
    pointer-events: none;
  }
  .hud-tl { top: 16px; left: 16px; }
  .hud-tr { top: 16px; right: 16px; text-align: right; }
  .hud-bl { bottom: 16px; left: 16px; }
  .hud-br { bottom: 16px; right: 16px; text-align: right; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="intro">
  <svg class="intro-skull" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#00ffea"/>
        <stop offset="100%" stop-color="#00ff9d"/>
      </linearGradient>
    </defs>
    <path d="M100 15 C55 15 25 50 25 95 C25 125 35 140 45 148 L45 175 C45 185 55 190 65 190 L75 190 L75 170 L125 170 L125 190 L135 190 C145 190 155 185 155 175 L155 148 C165 140 175 125 175 95 C175 50 145 15 100 15 Z M70 95 A15 15 0 1 1 70 94.9 Z M130 95 A15 15 0 1 1 130 94.9 Z M100 115 L92 138 L108 138 Z" fill="url(#g1)"/>
  </svg>
  <div class="intro-brand">NEKROS AWAKENING</div>
  <div class="intro-text">[ TAP TO INITIATE ]</div>
</div>

<canvas id="particles"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- HUD -->
<div class="hud hud-tl">NEKROS.AWAKENING // <span id="clock">00:00:00</span></div>
<div class="hud hud-tr"><span class="dot" style="display:inline-block;width:6px;height:6px;background:#ff3355;border-radius:50%;margin-right:6px;box-shadow:0 0 8px #ff3355;"></span>LIVE</div>
<div class="hud hud-bl">NODE: 0xDEAD // CIPHER: X-CHAOS-512</div>
<div class="hud hud-br">BUILD 6.6.6</div>

<!-- ГЛАВНЫЙ ЭКРАН С ЧАТОМ -->
<div id="main">
  <div class="skull-wrap">
    <div class="skull-small">
      <div class="glitch-layer glitch-1">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <path d="M100 15 C55 15 25 50 25 95 C25 125 35 140 45 148 L45 175 C45 185 55 190 65 190 L75 190 L75 170 L125 170 L125 190 L135 190 C145 190 155 185 155 175 L155 148 C165 140 175 125 175 95 C175 50 145 15 100 15 Z M70 95 A15 15 0 1 1 70 94.9 Z M130 95 A15 15 0 1 1 130 94.9 Z M100 115 L92 138 L108 138 Z" fill="#ff00aa"/>
        </svg>
      </div>
      <div class="glitch-layer glitch-2">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <path d="M100 15 C55 15 25 50 25 95 C25 125 35 140 45 148 L45 175 C45 185 55 190 65 190 L75 190 L75 170 L125 170 L125 190 L135 190 C145 190 155 185 155 175 L155 148 C165 140 175 125 175 95 C175 50 145 15 100 15 Z M70 95 A15 15 0 1 1 70 94.9 Z M130 95 A15 15 0 1 1 130 94.9 Z M100 115 L92 138 L108 138 Z" fill="#00aaff"/>
        </svg>
      </div>
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
        <defs>
          <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ffea"/>
            <stop offset="100%" stop-color="#00ff9d"/>
          </linearGradient>
        </defs>
        <path d="M100 15 C55 15 25 50 25 95 C25 125 35 140 45 148 L45 175 C45 185 55 190 65 190 L75 190 L75 170 L125 170 L125 190 L135 190 C145 190 155 185 155 175 L155 148 C165 140 175 125 175 95 C175 50 145 15 100 15 Z M70 95 A15 15 0 1 1 70 94.9 Z M130 95 A15 15 0 1 1 130 94.9 Z M100 115 L92 138 L108 138 Z" fill="url(#g2)" opacity="0.95"/>
      </svg>
    </div>
    <div class="brand">NEKROS AWAKENING</div>
  </div>

  <div class="chat-wrap">
    <div class="chat-header">
      <span><span class="dot"></span>SECURE CHANNEL // NEKROS</span>
      <span id="online">ONLINE</span>
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input-wrap">
      <input type="text" class="chat-input" id="chatInput" placeholder="Введите сообщение..." autocomplete="off">
      <button class="chat-send" id="chatSend">➤</button>
    </div>
  </div>
</div>

<script>
/* ============ ЧАСТИЦЫ ============ */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H, columns, drops;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  columns = Math.floor(W / 16);
  drops = Array(columns).fill(1).map(() => Math.random() * H);
}
resize();
window.addEventListener('resize', resize);

const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノABCDEF#$%&*<>/\\';
function drawRain() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = '14px monospace';
  for (let i = 0; i < drops.length; i++) {
    const c = chars[Math.floor(Math.random() * chars.length)];
    const x = i * 16;
    const y = drops[i];
    ctx.fillStyle = Math.random() > 0.95 ? '#00ffea' : '#00ff9d';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#00ff9d';
    ctx.fillText(c, x, y);
    ctx.shadowBlur = 0;
    if (y > H && Math.random() > 0.975) drops[i] = 0;
    drops[i] += 16;
  }
}
setInterval(drawRain, 50);

/* ============ ЧАСЫ ============ */
setInterval(() => {
  const d = new Date();
  const t = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, '0')).join(':');
  document.getElementById('clock').textContent = t;
}, 1000);

/* ============ АУДИО ФОН ============ */
let audioCtx = null;
function startAmbient() {
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  const hum = audioCtx.createOscillator();
  hum.type = 'sawtooth';
  hum.frequency.value = 55;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 180;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.04;
  hum.connect(filter).connect(gain).connect(audioCtx.destination);
  hum.start();

  const hum2 = audioCtx.createOscillator();
  hum2.type = 'sawtooth';
  hum2.frequency.value = 55 * 1.008;
  const gain2 = audioCtx.createGain();
  gain2.gain.value = 0.025;
  hum2.connect(filter).connect(gain2).connect(audioCtx.destination);
  hum2.start();
}

/* ============ ПРОФЕССОРСКИЙ ГОЛОС ============ */
const GREETING = "Здравствуйте. Добро пожаловать на NEKROS AWAKENING. Вы в безопасности. Никто вас не видит и не слышит. Здесь вы можете свободно общаться. Напишите что-нибудь, чтобы начать разговор.";

let ruVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  // Ищем приятный мужской русский голос
  ruVoice = voices.find(v => /ru/i.test(v.lang) && /yuri|pavel|dmitri|maxim|aleksandr|milena/i.test(v.name))
         || voices.find(v => /ru/i.test(v.lang))
         || voices[0];
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

function speakNormal(text) {
  // Разбиваем на предложения для естественной паузы
  const parts = text.split(/(?<=[.!?])\s+/);
  let i = 0;
  function next() {
    if (i >= parts.length) return;
    const u = new SpeechSynthesisUtterance(parts[i]);
    u.lang = 'ru-RU';
    if (ruVoice) u.voice = ruVoice;
    u.pitch = 1.0;      // нормальный голос
    u.rate = 0.95;      // чуть медленнее, спокойно
    u.volume = 1.0;
    i++;
    u.onend = () => setTimeout(next, 250);
    u.onerror = () => setTimeout(next, 250);
    speechSynthesis.speak(u);
  }
  next();
}

/* ============ ЧАТ ============ */
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('chatInput');
const sendBtn = document.getElementById('chatSend');

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  if (who === 'bot') {
    div.innerHTML = `<div class="name">NEKROS</div>${escapeHtml(text)}`;
  } else {
    div.innerHTML = `<div class="name">ВЫ</div>${escapeHtml(text)}`;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Простые ответы
const botReplies = [
  "Принято. Я вас слышу.",
  "Интересно... расскажите подробнее.",
  "Продолжайте, я записываю.",
  "Понятно. Что ещё вы хотите сказать?",
  "Ваше сообщение сохранено в защищённом канале.",
  "Я здесь. Продолжайте.",
  "Хм. Любопытно.",
  "Записи ведутся. Говорите свободно.",
  "Сигнал принят. Ответ обрабатывается.",
  "Я слушаю вас внимательно."
];

function botReply(userText) {
  // Небольшая задержка как будто "печатает"
  setTimeout(() => {
    const lower = userText.toLowerCase();
    let reply;
    if (/привет|здравств|хай|hi|hello/.test(lower)) {
      reply = "Приветствую. Рад вас видеть в системе.";
    } else if (/как дела|как ты|how are you/.test(lower)) {
      reply = "Все процессы работают штатно. Спасибо, что спросили.";
    } else if (/кто ты|что ты/.test(lower)) {
      reply = "Я NEKROS — система-хранитель этого канала. Здесь ваши слова остаются между нами.";
    } else if (/спасибо|благодар/.test(lower)) {
      reply = "Всегда пожалуйста. Обращайтесь.";
    } else if (/пока|до свид|bye/.test(lower)) {
      reply = "Канал остаётся открытым. Возвращайтесь, когда захотите.";
    } else if (/\?$/.test(userText.trim())) {
      reply = "Хороший вопрос. Но ответы на такие вещи вы найдёте сами.";
    } else {
      reply = botReplies[Math.floor(Math.random() * botReplies.length)];
    }
    addMessage(reply, 'bot');
    speakNormal(reply);
  }, 700 + Math.random() * 500);
}

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  inputEl.value = '';
  botReply(text);
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

/* ============ СТАРТ ============ */
document.getElementById('intro').addEventListener('click', () => {
  document.getElementById('intro').classList.add('hide');

  try { startAmbient(); } catch(e) {}

  // Показываем главный экран сразу
  setTimeout(() => {
    document.getElementById('main').classList.add('show');

    // Приветствие
    addMessage("Соединение установлено. Канал защищён.", 'bot');
    speakNormal(GREETING);

    // Может, задать наводящий вопрос через пару секунд
    setTimeout(() => {
      addMessage("Спросите что угодно — я отвечу.", 'bot');
    }, 6000);
  }, 400);
});
</script>
</body>
</html>
