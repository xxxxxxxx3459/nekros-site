  .scanlines {

  .vignette {

  #intro {

  #intro .intro-skull { width: 200px; height: 200px; filter: drop-shadow(0 0 40px #00ff9d); animation: introPulse 2s ease-in-out infinite; }

    94% { transform: translate(6px, -4px); opacity: 1; }

<script>
/* ============ МАТРИЦА ============ */
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let W, H, columns, drops;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  columns = Math.floor(W / 16);
  drops = Array(columns).fill(0).map(() => Math.random() * H);
}
resize();
window.addEventListener('resize', resize);
const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンABCDEF#$%&*<>/\\+=';
function drawMatrix() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = '16px monospace';
  for (let i = 0; i < drops.length; i++) {
    const c = chars[Math.floor(Math.random() * chars.length)];
    const x = i * 16, y = drops[i];
    if (Math.random() > 0.97) {
      ctx.fillStyle = '#aaffdd'; ctx.shadowBlur = 15; ctx.shadowColor = '#00ffea';
    } else {
      ctx.fillStyle = Math.random() > 0.85 ? '#00ffea' : '#00ff9d';
      ctx.shadowBlur = 8; ctx.shadowColor = '#00ff9d';
    }
    ctx.fillText(c, x, y);
    ctx.shadowBlur = 0;
    if (y > H && Math.random() > 0.97) drops[i] = 0;
    drops[i] += 16;
  }
}
setInterval(drawMatrix, 33);

setInterval(() => {
  const d = new Date();
  const t = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
  document.getElementById('clock').textContent = t;
}, 1000);

/* ============ ЗВУК ============ */
let audioCtx = null;
function startAmbient() {
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  const hum = audioCtx.createOscillator();
  hum.type = 'sine';
  hum.frequency.value = 55;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 180;
  const gain = audioCtx.createGain(); gain.gain.value = 0.02;
  hum.connect(filter).connect(gain).connect(audioCtx.destination);
  hum.start();
}

/* ============ ГОЛОС — УЛУЧШЕННЫЙ ВЫБОР ============ */
let ruVoice = null;
let voiceScore = 0;

function scoreVoice(v) {
  let s = 0;
  const n = v.name.toLowerCase();
  const l = v.lang.toLowerCase();
  if (!l.startsWith('ru')) return -100;
  s += 30; // русский голос
  // Имена качественных мужских голосов
  if (/yuri|юрий/.test(n)) s += 100;
  if (/dmitri|дмитрий|dmitry/.test(n)) s += 95;
  if (/pavel|павел/.test(n)) s += 90;
  if (/maxim|максим/.test(n)) s += 90;
  if (/aleksandr|александр/.test(n)) s += 85;
  if (/milena|милена/.test(n)) s += 50; // женский но качественный
  if (/male|муж/.test(n)) s += 60;
  if (/female|жен/.test(n)) s += 20;
  // Premium/Enhanced/Neural/Siri голоса качественнее
  if (/premium|enhanced|neural|siri|natural|siri/.test(n)) s += 120;
  if (/compact|compacta|espeak|low quality/.test(n)) s -= 60;
  // Google и Microsoft голоса обычно получше
  if (/google|microsoft/.test(n)) s += 20;
  if (/apple/.test(n)) s += 15;
  return s;
}

function pickVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  let best = null, bestScore = -999;
  for (const v of voices) {
    const s = scoreVoice(v);
    if (s > bestScore) { bestScore = s; best = v; }
  }
  if (best && bestScore > 0) {
    ruVoice = best;
    voiceScore = bestScore;
    console.log('NEKROS voice:', best.name, '| score:', bestScore);
  }
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
setTimeout(pickVoice, 500);
setTimeout(pickVoice, 1500);

function speak(text) {
  if (speechSynthesis.speaking) speechSynthesis.cancel();
  const parts = text.split(/(?<=[.!?])\s+/);
  let i = 0;
  function next() {
    if (i >= parts.length) return;
    const u = new SpeechSynthesisUtterance(parts[i]);
    u.lang = 'ru-RU';
    if (ruVoice) u.voice = ruVoice;
    // Приятные параметры — натуральный мужской голос
    u.pitch = 0.95;   // чуть ниже среднего — звучит солиднее
    u.rate = 0.97;    // почти нормальный темп, чуть медленнее
    u.volume = 1.0;
    i++;
    u.onend = () => setTimeout(next, 220);
    u.onerror = () => setTimeout(next, 220);
    speechSynthesis.speak(u);
  }
  next();
}

/* ============ ЧАТ ============ */
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('chatInput');
const sendBtn = document.getElementById('chatSend');
const recentReplies = [];
function pickUnique(arr) {
  const fresh = arr.filter(r => !recentReplies.includes(r));
  const pool = fresh.length ? fresh : arr;
  const r = pool[Math.floor(Math.random() * pool.length)];
  recentReplies.push(r);
  if (recentReplies.length > 6) recentReplies.shift();
  return r;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const content = escapeHtml(text).replace(/\n/g, '<br>');
  div.innerHTML = `<div class="name">${who === 'bot' ? 'NEKROS' : 'ВЫ'}</div>${content}`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="name">NEKROS</div>обрабатываю запрос...';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function normalizeCity(raw) {
  let w = raw.toLowerCase().trim();
  const endings = ['е', 'у', 'ы', 'и', 'ой', 'ей', 'а', 'я', 'ь', 'ю', 'ов', 'ев', 'ах', 'ям', 'ом', 'ем', 'ами', 'ями'];
  const variants = new Set();
  variants.add(w);
  for (const e of endings) {
    if (w.endsWith(e) && w.length - e.length >= 3) {
      variants.add(w.slice(0, -e.length));
      variants.add(w.slice(0, -e.length) + 'а');
      variants.add(w.slice(0, -e.length) + 'ь');
    }
  }
  return Array.from(variants);
}

function transliterate(str) {
  const map = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
  return str.split('').map(c => map[c] !== undefined ? map[c] : c).join('');
}

async function findCity(query) {
  const variants = normalizeCity(query);
  for (const v of variants) {
    if (CITY_DB[v]) return CITY_DB[v];
  }
  for (const key in CITY_DB) {
    for (const v of variants) {
      if (v === key || key.startsWith(v) || v.startsWith(key)) return CITY_DB[key];
    }
  }
  for (const v of variants) {
    if (!v || v.length < 3) continue;
    try {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=1&language=ru&format=json`;
      const r = await fetch(url);
      const data = await r.json();
      if (data.results && data.results.length) {
        const c = data.results[0];
        return { name: c.name, country: c.country, lat: c.latitude, lon: c.longitude };
      }
    } catch(e) {}
    try {
      const latin = transliterate(v);
      if (latin !== v) {
        const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(latin)}&count=1&format=json`;
        const r = await fetch(url);
        const data = await r.json();
        if (data.results && data.results.length) {
          const c = data.results[0];
          return { name: c.name, country: c.country, lat: c.latitude, lon: c.longitude };
        }
      }
    } catch(e) {}
  }
  return null;
}

async function getWeatherByCoords(lat, lon) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code&timezone=auto&forecast_days=3`;
    const r = await fetch(url);
    return await r.json();
  } catch (e) { return null; }
}

function formatWeather(data, cityName) {
  if (!data || !data.current) return null;
  const c = data.current;
  const daily = data.daily;
  const desc = describeWeatherCode(c.weather_code);
  const temp = Math.round(c.temperature_2m);
  const feels = Math.round(c.apparent_temperature);
  const hum = c.relative_humidity_2m;
  const wind = Math.round(c.wind_speed_10m);
  const precip = c.precipitation;
  let text = `Погода в ${cityName}:\n`;
  text += `Сейчас ${temp}°C, ощущается как ${feels}°C. ${desc.charAt(0).toUpperCase() + desc.slice(1)}.\n`;
  text += `Влажность ${hum}%, ветер ${wind} км/ч`;
  if (precip > 0) text += `, осадки ${precip} мм`;
  text += '.\n';
  if (daily && daily.time && daily.time.length >= 2) {
    text += `\nПрогноз:\n`;
    for (let i = 0; i < Math.min(3, daily.time.length); i++) {
      const d = new Date(daily.time[i]);
      const dayName = i === 0 ? 'Сегодня' : i === 1 ? 'Завтра' : d.toLocaleDateString('ru-RU', { weekday: 'long' });
      const tmin = Math.round(daily.temperature_2m_min[i]);
      const tmax = Math.round(daily.temperature_2m_max[i]);
      const dDesc = describeWeatherCode(daily.weather_code[i]);
      text += `${dayName}: ${tmin}°C … ${tmax}°C, ${dDesc}.\n`;
    }
  }
  if (temp <= 0) text += `\nСовет: одевайтесь очень тепло — пуховик, шапка, перчатки, тёплая обувь.`;
  else if (temp <= 10) text += `\nСовет: куртка, свитер, шапка не помешает.`;
  else if (temp <= 18) text += `\nСовет: лёгкая куртка или ветровка, джинсы.`;
  else if (temp <= 25) text += `\nСовет: футболка, лёгкие брюки или шорты.`;
  else text += `\nСовет: лёгкая одежда, головной убор, вода с собой.`;
  if ((c.weather_code >= 51 && c.weather_code <= 67) || (c.weather_code >= 80 && c.weather_code <= 82)) text += ` Не забудьте зонт.`;
  if (c.weather_code >= 71 && c.weather_code <= 86) text += ` Возьмите тёплую обувь.`;
  return text;
}

function extractCity(text) {
  let cleaned = text.toLowerCase().replace(/[?!.,;:]/g, ' ')
    .replace(/погод[ауы]?|прогноз|температур[ауы]?/gi, ' ')
    .replace(/\b(сейчас|сегодня|завтра|пожалуйста|мне|скажи|расскажи|какая|какой|какое|какие|будет|покажи|узнай|хочу|знать|можешь|подскажи|сколько|градусов|погода)\b/gi, ' ')
    .replace(/\s+/g, ' ').trim();
  let mV = cleaned.match(/\bв[о]?\s+([а-яёa-z\-]+(?:\s+[а-яёa-z\-]+)?)/i);
  if (mV && mV[1]) {
    let c = mV[1].trim().replace(/\s+(сейчас|сегодня|завтра|будет|на|в|и)$/i, '').trim();
    if (c.length >= 3) return c;
  }
  const origWords = text.split(/\s+/);
  for (const ow of origWords) {
    const clean = ow.replace(/[?!.,;:]/g, '');
    if (clean.length >= 3 && /^[А-ЯЁA-Z]/.test(clean)) return clean;
  }
  const words = cleaned.split(/\s+/).filter(w => w.length >= 3);
  if (words.length) return words[words.length - 1];
  return null;
}

function askGeo() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => resolve(null),
      { timeout: 5000, maximumAge: 600000 }
    );
  });
}

async function handleWeather(userText) {
  let city = extractCity(userText);
  let cityName = null;
  let data = null;
  if (city) {
    const found = await findCity(city);
    if (found) {
      cityName = found.name + (found.country ? ', ' + found.country : '');
      data = await getWeatherByCoords(found.lat, found.lon);
    } else {
      return `Не нашёл город "${city}". Попробуйте: "погода в Москве".`;
    }
  } else {
    const coords = await askGeo();
    if (coords) {
      cityName = 'вашей локации';
      data = await getWeatherByCoords(coords.lat, coords.lon);
    } else {
      return 'Укажите город: например, "погода в Москве".';
    }
  }
  if (!data) return 'Не удалось получить данные. Попробуйте ещё раз.';
  return formatWeather(data, cityName);
}

/* ============ FALLBACK ============ */
function smartFallback(text) {
  const lower = text.toLowerCase().trim();
  const isQuestion = /\?$/.test(lower) || /^(что|где|когда|почему|зачем|как|кто|какой|какая|какое|какие|сколько|можно ли|правда ли|есть ли|стоит ли|помоги)\b/i.test(lower);
  if (isQuestion) {
    return pickUnique([
      'Уточните пожалуйста — что именно вас интересует? Могу помочь с учёбой, работой, здоровьем, техникой, погодой и другими темами.',
      'Опишите вопрос подробнее — тогда дам развёрнутый ответ. Например: "как решить задачу по физике про скорость" или "как написать диплом".',
      'Расскажите подробнее — и я подскажу по существу.',
      'Задайте вопрос конкретнее — помогу с чем смогу.'
    ]);
  }
  return pickUnique([
    'Понял вас. Расскажите подробнее — как я могу помочь?',
    'Слушаю. Что вы хотите обсудить?',
    'Интересно. Продолжайте.',
    'Понимаю. Спросите что-то конкретное.',
    'Хорошо. О чём бы вы хотели поговорить?'
  ]);
}

async function getReply(text) {
  const lower = text.toLowerCase();
  if (/погод|дожд|снег|жарко|холодно|прогноз|температур|градус|что надеть|зонт|на улице/i.test(lower)) {
    return await handleWeather(text);
  }
  const matches = [];
  for (const k of K) {
    for (const key of k.keys) {
      if (lower.includes(key)) matches.push({ k, key });
    }
  }
  if (matches.length) {
    matches.sort((a, b) => b.key.length - a.key.length);
    return pickUnique(matches[0].k.replies);
  }
  return smartFallback(text);
}

async function botReply(userText) {
  showTyping();
  await new Promise(r => setTimeout(r, 400 + Math.random() * 400));
  const reply = await getReply(userText);
  hideTyping();
  addMessage(reply, 'bot');
  speak(reply);
}

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  inputEl.value = '';
  botReply(text);
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
