<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEKROS AWAKENING</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: 'Courier New', monospace; color: #00ff9d;
    cursor: crosshair; -webkit-tap-highlight-color: transparent;
  }

  /* ASCII-ЧЕРЕПА ФОН */
  #ascii-bg {
    position: fixed; inset: -100px;
    z-index: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, 80px);
    grid-auto-rows: 100px;
    opacity: 0.28;
    pointer-events: none;
    animation: bgShift 15s linear infinite;
  }
  @keyframes bgShift {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-80px, -100px); }
  }
  .ascii-skull {
    width: 80px; height: 100px;
    display: flex; align-items: center; justify-content: center;
    color: #ffffff; font-size: 5.5px; line-height: 5.5px;
    font-family: 'Courier New', monospace;
    white-space: pre; text-align: center;
    text-shadow: 0 0 2px rgba(255,255,255,0.4);
    animation: skullFlick 4s infinite;
    user-select: none;
  }
  @keyframes skullFlick {
    0%, 100% { opacity: 0.85; }
    48% { opacity: 0.85; }
    50% { opacity: 0.35; }
    52% { opacity: 0.85; }
  }

  /* МАТРИЦА */
  #matrix { position: fixed; inset: 0; z-index: 1; opacity: 0.35; }

  /* ВЕРТИКАЛЬНЫЕ ПОЛОСЫ */
  #stripes {
    position: fixed; inset: 0; z-index: 2;
    background: repeating-linear-gradient(
      90deg,
      rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 1px,
      transparent 1px, transparent 2px
    );
    pointer-events: none; mix-blend-mode: overlay;
  }

  /* СКАНЛАЙНЫ */
  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,255,157,0.03) 0px, rgba(0,255,157,0.03) 1px,
      transparent 1px, transparent 3px
    );
    pointer-events: none; z-index: 20;
    animation: scanmove 8s linear infinite;
  }
  @keyframes scanmove {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.95) 100%);
    pointer-events: none; z-index: 19;
  }

  /* ВСПЫШКА ГЛИТЧА */
  #flash {
    position: fixed; inset: 0; z-index: 30;
    background: #fff; opacity: 0;
    pointer-events: none; mix-blend-mode: difference;
  }

  /* ЭКРАН ВХОДА */
  #intro {
    position: fixed; inset: 0; background: #000; z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity 0.6s ease;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  .intro-skull-wrap {
    position: relative; width: 220px; height: 220px;
    display: flex; align-items: center; justify-content: center;
  }
  .skull-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .skull-main { filter: drop-shadow(0 0 25px #fff); animation: introPulse 2s ease-in-out infinite; z-index: 3; }
  .skull-red { filter: drop-shadow(0 0 8px #ff0044); mix-blend-mode: screen; animation: rgbRed 0.3s infinite steps(1); z-index: 2; }
  .skull-blue { filter: drop-shadow(0 0 8px #00aaff); mix-blend-mode: screen; animation: rgbBlue 0.35s infinite steps(1); z-index: 1; }
  @keyframes introPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px #fff); }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 45px #fff); }
  }
  @keyframes rgbRed {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-4px, 2px); }
    50% { transform: translate(2px, -3px); }
    75% { transform: translate(-3px, -1px); }
    100% { transform: translate(3px, 2px); }
  }
  @keyframes rgbBlue {
    0% { transform: translate(0, 0); }
    25% { transform: translate(4px, -2px); }
    50% { transform: translate(-2px, 3px); }
    75% { transform: translate(3px, 1px); }
    100% { transform: translate(-3px, -2px); }
  }
  .intro-brand {
    margin-top: 40px; font-size: 20px; letter-spacing: 16px;
    color: #00ffea;
    text-shadow: 0 0 20px #00ffea, 2px 0 0 #ff0044, -2px 0 0 #00aaff;
    font-weight: bold; animation: textGlitch 3s infinite;
  }
  @keyframes textGlitch {
    0%, 90%, 100% { text-shadow: 0 0 20px #00ffea, 2px 0 0 #ff0044, -2px 0 0 #00aaff; }
    92% { text-shadow: 0 0 20px #00ffea, -4px 0 0 #ff0044, 4px 0 0 #00aaff; }
    94% { text-shadow: 0 0 20px #00ffea, 3px 0 0 #ff0044, -3px 0 0 #00aaff; }
  }
  .intro-text {
    margin-top: 40px; font-size: 14px; letter-spacing: 8px;
    color: #00ff9d; text-shadow: 0 0 12px #00ff9d;
    animation: blink 1.4s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ГЛАВНЫЙ ЭКРАН */
  #main {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
  }
  #main.show { opacity: 1; pointer-events: all; }

  /* ЦЕНТРАЛЬНЫЙ ЧЕРЕП */
  .skull-center {
    position: absolute; top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    width: 260px; height: 260px;
    pointer-events: none; z-index: 3;
    animation: skullPulse 3s ease-in-out infinite;
  }
  @keyframes skullPulse {
    0%, 100% { filter: drop-shadow(0 0 25px #fff); transform: translate(-50%, -50%) scale(1); }
    50% { filter: drop-shadow(0 0 50px #fff); transform: translate(-50%, -50%) scale(1.04); }
  }
  .skull-center svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .glitch-red { animation: glitch1 2.8s infinite; mix-blend-mode: screen; }
  .glitch-blue { animation: glitch2 3.6s infinite; mix-blend-mode: screen; }
  @keyframes glitch1 {
    0%, 88%, 100% { transform: translate(0); opacity: 0; }
    90% { transform: translate(-8px, 3px); opacity: 1; }
    92% { transform: translate(6px, -4px); opacity: 1; }
    94% { transform: translate(-3px, 2px); opacity: 1; }
    96% { transform: translate(0); opacity: 0; }
  }
  @keyframes glitch2 {
    0%, 84%, 100% { transform: translate(0); opacity: 0; }
    86% { transform: translate(7px, -3px); opacity: 1; }
    89% { transform: translate(-5px, 5px); opacity: 1; }
    92% { transform: translate(3px, -2px); opacity: 1; }
    94% { transform: translate(0); opacity: 0; }
  }

  .brand-title {
    position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
    font-size: 13px; letter-spacing: 10px; color: #00ffea;
    text-shadow: 0 0 15px #00ffea, 2px 0 0 #ff0044, -2px 0 0 #00aaff;
    font-weight: bold; z-index: 6; pointer-events: none;
    animation: textGlitch 3s infinite;
  }

  /* СООБЩЕНИЯ */
  .messages {
    position: absolute; inset: 0; bottom: 80px; top: 80px;
    overflow-y: auto; padding: 30px 20px 20px;
    display: flex; flex-direction: column; gap: 12px;
    z-index: 4; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .messages::-webkit-scrollbar { display: none; }
  .msg {
    max-width: 88%; padding: 10px 14px;
    font-size: 14px; line-height: 1.55; letter-spacing: 0.4px;
    animation: msgIn 0.35s ease; word-wrap: break-word;
    background: rgba(0, 0, 0, 0.78); backdrop-filter: blur(4px);
    border-left: 2px solid #00ff9d;
    text-shadow: 0 0 8px rgba(0,255,157,0.4);
    box-shadow: 0 0 15px rgba(0,255,157,0.1);
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg.bot { align-self: flex-start; color: #b8ffd9; }
  .msg.user {
    align-self: flex-end; color: #a8fff5;
    border-left: none; border-right: 2px solid #00ffea;
    background: rgba(0, 20, 20, 0.78);
    text-shadow: 0 0 8px rgba(0,255,234,0.4);
    box-shadow: 0 0 15px rgba(0,255,234,0.15);
  }
  .msg .name { font-size: 9px; letter-spacing: 3px; opacity: 0.65; margin-bottom: 4px; color: #00ff9d; }
  .msg.typing { color: #00ff9d; opacity: 0.75; font-style: italic; }

  /* ВВОД */
  .input-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px 20px 24px;
    background: linear-gradient(to top, rgba(0,0,0,0.98), rgba(0,0,0,0.7), transparent);
    display: flex; align-items: center; gap: 10px; z-index: 10;
  }
  .input-field {
    flex: 1; background: rgba(0, 20, 10, 0.6);
    border: none; border-bottom: 1px solid rgba(0,255,157,0.4);
    outline: none; color: #00ffea; padding: 12px 6px;
    font-family: 'Courier New', monospace; font-size: 15px;
    letter-spacing: 1px; text-shadow: 0 0 6px rgba(0,255,234,0.5);
    transition: border-color 0.3s;
  }
  .input-field:focus { border-bottom-color: #00ffea; }
  .input-field::placeholder { color: rgba(0,255,157,0.4); letter-spacing: 2px; font-size: 13px; }
  .send-btn {
    background: transparent; border: none; color: #00ff9d;
    font-size: 22px; padding: 8px 12px; cursor: pointer;
    text-shadow: 0 0 10px #00ff9d; transition: all 0.2s; font-family: monospace;
  }
  .send-btn:active { color: #00ffea; text-shadow: 0 0 20px #00ffea; transform: scale(1.15); }

  /* HUD */
  .hud {
    position: fixed; font-size: 9px; letter-spacing: 2px;
    color: #00ff9d; opacity: 0.6; z-index: 6;
    pointer-events: none; text-shadow: 0 0 6px #00ff9d;
  }
  .hud-tl { top: 16px; left: 16px; }
  .hud-tr { top: 16px; right: 16px; text-align: right; }
  .hud-bl { bottom: 16px; left: 16px; }
  .hud-br { bottom: 16px; right: 16px; text-align: right; }
  .dot-live {
    display: inline-block; width: 6px; height: 6px; background: #ff3355;
    border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px #ff3355;
    animation: blink 1s infinite; vertical-align: middle;
  }
</style>
</head>
<body>

<div id="ascii-bg"></div>
<canvas id="matrix"></canvas>
<div id="stripes"></div>
<div class="scanlines"></div>
<div class="vignette"></div>
<div id="flash"></div>

<div class="hud hud-tl">NEKROS.AWAKENING // <span id="clock">00:00:00</span></div>
<div class="hud hud-tr"><span class="dot-live"></span>LIVE</div>
<div class="hud hud-bl">NODE: 0xDEAD // X-CHAOS-512</div>
<div class="hud hud-br">BUILD 13.0.0</div>

<div id="intro">
  <div class="intro-skull-wrap">
    <svg class="skull-svg skull-blue" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 12 C58 12 28 42 28 88 C28 112 34 128 42 138 L42 168 C42 178 48 182 55 182 L70 182 L70 165 L82 165 L82 182 L118 182 L118 165 L130 165 L130 182 L145 182 C152 182 158 178 158 168 L158 138 C166 128 172 112 172 88 C172 42 142 12 100 12 Z M70 95 L70 112 L45 112 L45 95 Z M122 95 L122 112 L155 112 L155 95 Z M92 118 L92 140 L108 140 L108 118 Z" fill="#00aaff"/>
    </svg>
    <svg class="skull-svg skull-red" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 12 C58 12 28 42 28 88 C28 112 34 128 42 138 L42 168 C42 178 48 182 55 182 L70 182 L70 165 L82 165 L82 182 L118 182 L118 165 L130 165 L130 182 L145 182 C152 182 158 178 158 168 L158 138 C166 128 172 112 172 88 C172 42 142 12 100 12 Z M70 95 L70 112 L45 112 L45 95 Z M122 95 L122 112 L155 112 L155 95 Z M92 118 L92 140 L108 140 L108 118 Z" fill="#ff0044"/>
    </svg>
    <svg class="skull-svg skull-main" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 12 C58 12 28 42 28 88 C28 112 34 128 42 138 L42 168 C42 178 48 182 55 182 L70 182 L70 165 L82 165 L82 182 L118 182 L118 165 L130 165 L130 182 L145 182 C152 182 158 178 158 168 L158 138 C166 128 172 112 172 88 C172 42 142 12 100 12 Z M70 95 L70 112 L45 112 L45 95 Z M122 95 L122 112 L155 112 L155 95 Z M92 118 L92 140 L108 140 L108 118 Z" fill="#ffffff"/>
    </svg>
  </div>
  <div class="intro-brand">NEKROS AWAKENING</div>
  <div class="intro-text">[ TAP TO INITIATE ]</div>
</div>

<div id="main">
  <div class="brand-title">N E K R O S</div>

  <div class="skull-center">
    <svg class="glitch-blue" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 12 C58 12 28 42 28 88 C28 112 34 128 42 138 L42 168 C42 178 48 182 55 182 L70 182 L70 165 L82 165 L82 182 L118 182 L118 165 L130 165 L130 182 L145 182 C152 182 158 178 158 168 L158 138 C166 128 172 112 172 88 C172 42 142 12 100 12 Z M70 95 L70 112 L45 112 L45 95 Z M122 95 L122 112 L155 112 L155 95 Z M92 118 L92 140 L108 140 L108 118 Z" fill="#00aaff"/>
    </svg>
    <svg class="glitch-red" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 12 C58 12 28 42 28 88 C28 112 34 128 42 138 L42 168 C42 178 48 182 55 182 L70 182 L70 165 L82 165 L82 182 L118 182 L118 165 L130 165 L130 182 L145 182 C152 182 158 178 158 168 L158 138 C166 128 172 112 172 88 C172 42 142 12 100 12 Z M70 95 L70 112 L45 112 L45 95 Z M122 95 L122 112 L155 112 L155 95 Z M92 118 L92 140 L108 140 L108 118 Z" fill="#ff0044"/>
    </svg>
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="skullGlow" cx="50%" cy="45%" r="60%">
          <stop offset="0%" stop-color="#1a1a1a"/>
          <stop offset="100%" stop-color="#000000"/>
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="1.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d="M100 12 C58 12 28 42 28 88 C28 112 34 128 42 138 L42 168 C42 178 48 182 55 182 L70 182 L70 165 L82 165 L82 182 L118 182 L118 165 L130 165 L130 182 L145 182 C152 182 158 178 158 168 L158 138 C166 128 172 112 172 88 C172 42 142 12 100 12 Z" fill="url(#skullGlow)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
      <path d="M70 95 L70 112 L45 112 L45 95 Z" fill="#000" stroke="#fff" stroke-width="1.5"/>
      <path d="M122 95 L122 112 L155 112 L155 95 Z" fill="#000" stroke="#fff" stroke-width="1.5"/>
      <path d="M92 118 L92 140 L108 140 L108 118 Z" fill="#000" stroke="#fff" stroke-width="1.5"/>
      <path d="M58 155 L64 148 L70 155 L76 148 L82 155 L88 148 L94 155 L100 148 L106 155 L112 148 L118 155 L124 148 L130 155 L136 148 L142 155" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    </svg>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-bar">
    <input type="text" class="input-field" id="chatInput" placeholder="Спросите NEKROS..." autocomplete="off">
    <button class="send-btn" id="chatSend">▶</button>
  </div>
</div>

<script>
/* ============================================================
   ASCII ЧЕРЕПА ФОН
   ============================================================ */
const asciiSkullArt = [
  '      ╱▔▔▔▔▔▔╲      ',
  '     ╱  ▄▄▄▄  ╲     ',
  '    │  █▀  ▀█  │    ',
  '    │  ██████  │    ',
  '    │  ▀████▀  │    ',
  '    │   ▀▀▀▀   │    ',
  '     ╲  █  █  ╱     ',
  '      ╲_▄▄▄▄_╱      ',
  '       █ █ █ █       ',
  '      ▀▀▀▀▀▀▀       '
].join('\n');

function buildAsciiBg() {
  const bg = document.getElementById('ascii-bg');
  const total = 80;
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'ascii-skull';
    d.textContent = asciiSkullArt;
    d.style.animationDelay = (Math.random() * 4) + 's';
    bg.appendChild(d);
  }
}
buildAsciiBg();

/* ============================================================
   МАТРИЦА
   ============================================================ */
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let W, H, columns, drops;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  columns = Math.floor(W / 16);
  drops = Array(columns).fill(0).map(() => Math.random() * H);
}
resize();
window.addEventListener('resize', resize);
const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンABCDEF#$%&*<>/\\+=';
function drawMatrix() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = '16px monospace';
  for (let i = 0; i < drops.length; i++) {
    const c = chars[Math.floor(Math.random() * chars.length)];
    const x = i * 16, y = drops[i];
    if (Math.random() > 0.97) {
      ctx.fillStyle = '#aaffdd';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ffea';
    } else {
      ctx.fillStyle = Math.random() > 0.85 ? '#00ffea' : '#00ff9d';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00ff9d';
    }
    ctx.fillText(c, x, y);
    ctx.shadowBlur = 0;
    if (y > H && Math.random() > 0.97) drops[i] = 0;
    drops[i] += 16;
  }
}
setInterval(drawMatrix, 33);

/* ============================================================
   ЧАСЫ
   ============================================================ */
setInterval(() => {
  const d = new Date();
  const t = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
  document.getElementById('clock').textContent = t;
}, 1000);

/* ============================================================
   ГЛИТЧ-ВСПЫШКИ
   ============================================================ */
const flashEl = document.getElementById('flash');
function randomFlash() {
  if (Math.random() > 0.75) {
    flashEl.style.transition = 'none';
    flashEl.style.opacity = '0.18';
    setTimeout(() => {
      flashEl.style.transition = 'opacity 0.15s';
      flashEl.style.opacity = '0';
    }, 40);
  }
  if (Math.random() > 0.9) {
    document.body.style.transform = 'translate(' + (Math.random() * 6 - 3) + 'px, ' + (Math.random() * 6 - 3) + 'px)';
    setTimeout(() => { document.body.style.transform = ''; }, 60);
  }
  setTimeout(randomFlash, 1200 + Math.random() * 3500);
}
randomFlash();

/* ============================================================
   ЗВУК ФОНА
   ============================================================ */
let audioCtx = null;
function startAmbient() {
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  const hum = audioCtx.createOscillator();
  hum.type = 'sine';
  hum.frequency.value = 55;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 180;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.02;
  hum.connect(filter).connect(gain).connect(audioCtx.destination);
  hum.start();
}

/* ============================================================
   ГОЛОС — МУЖСКОЙ
   ============================================================ */
let ruVoice = null;
let isMaleVoice = false;
function scoreVoice(v) {
  let s = 0;
  const n = v.name.toLowerCase();
  const l = v.lang.toLowerCase();
  if (!l.startsWith('ru')) return -10000;
  s += 100;
  if (/yuri|юрий/.test(n)) s += 500;
  if (/dmitri|дмитрий|dmitry/.test(n)) s += 490;
  if (/pavel|павел/.test(n)) s += 480;
  if (/maxim|максим/.test(n)) s += 480;
  if (/aleksandr|александр/.test(n)) s += 470;
  if (/\bmale\b|мужск/.test(n)) s += 400;
  if (/milena|милена|katya|катя|irina|ирина|female|женск|alena|алёна/.test(n)) s -= 800;
  if (/premium|enhanced|neural|natural|siri/.test(n)) s += 300;
  return s;
}
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  let best = null, bestScore = -9999;
  for (const v of voices) {
    const s = scoreVoice(v);
    if (s > bestScore) { bestScore = s; best = v; }
  }
  if (best && bestScore > 0) {
    ruVoice = best;
    isMaleVoice = bestScore >= 400;
  }
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
setTimeout(pickVoice, 500);
setTimeout(pickVoice, 1500);

function speak(text) {
  if (speechSynthesis.speaking) speechSynthesis.cancel();
  const parts = text.split(/(?<=[.!?])\s+/);
  let i = 0;
  function next() {
    if (i >= parts.length) return;
    const u = new SpeechSynthesisUtterance(parts[i]);
    u.lang = 'ru-RU';
    if (ruVoice) u.voice = ruVoice;
    if (isMaleVoice) {
      u.pitch = 0.9;
      u.rate = 0.97;
    } else {
      u.pitch = 0.35;
      u.rate = 0.9;
    }
    u.volume = 1.0;
    i++;
    u.onend = () => setTimeout(next, 200);
    u.onerror = () => setTimeout(next, 200);
    speechSynthesis.speak(u);
  }
  next();
}

/* ============================================================
   ЧАТ
   ============================================================ */
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('chatInput');
const sendBtn = document.getElementById('chatSend');

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const content = escapeHtml(text).replace(/\n/g, '<br>');
  div.innerHTML = '<div class="name">' + (who === 'bot' ? 'NEKROS' : 'ВЫ') + '</div>' + content;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;

function normalizeCity(raw) {
  let w = raw.toLowerCase().trim();
  const endings = ['е','у','ы','и','ой','ей','а','я','ь','ю','ов','ев','ах','ям','ом','ем','ами','ями'];
  const variants = new Set([w]);
  for (const e of endings) {
    if (w.endsWith(e) && w.length - e.length >= 3) {
      variants.add(w.slice(0, -e.length));
      variants.add(w.slice(0, -e.length) + 'а');
    }
  }
  return Array.from(variants);
}
async function findCity(query) {
  const variants = normalizeCity(query);
  for (const v of variants) { if (CITY_DB[v]) return CITY_DB[v]; }
  for (const key in CITY_DB) {
    for (const v of variants) { if (key.startsWith(v) || v.startsWith(key)) return CITY_DB[key]; }
  }
  for (const v of variants) {
    if (!v || v.length < 3) continue;
    try {
      const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(v) + '&count=1&language=ru&format=json');
      const data = await r.json();
      if (data.results && data.results.length) {
        const c = data.results[0];
        return { name: c.name, country: c.country, lat: c.latitude, lon: c.longitude };
      }
    } catch(e) {}
  }
  return null;
}
async function getWeatherByCoords(lat, lon) {
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=3');
    return await r.json();
  } catch (e) { return null; }
}
function formatWeather(data, cityName) {
  if (!data || !data.current) return null;
  const c = data.current, daily = data.daily;
  const temp = Math.round(c.temperature_2m);
  const feels = Math.round(c.apparent_temperature);
  let text = 'Погода в ' + cityName + ':\nСейчас ' + temp + '°C, ощущается как ' + feels + '°C. ' + describeWeatherCode(c.weather_code) + '.\nВлажность ' + c.relative_humidity_2m + '%, ветер ' + Math.round(c.wind_speed_10m) + ' км/ч.\n';
  if (daily && daily.time) {
    text += '\nПрогноз:\n';
    for (let i = 0; i < Math.min(3, daily.time.length); i++) {
      const d = new Date(daily.time[i]);
      const dayName = i === 0 ? 'Сегодня' : i === 1 ? 'Завтра' : d.toLocaleDateString('ru-RU', { weekday: 'long' });
      text += dayName + ': ' + Math.round(daily.temperature_2m_min[i]) + '°C … ' + Math.round(daily.temperature_2m_max[i]) + '°C, ' + describeWeatherCode(daily.weather_code[i]) + '.\n';
    }
  }
  if (temp <= 0) text += '\nСовет: пуховик, шапка, перчатки.';
  else if (temp <= 10) text += '\nСовет: куртка, свитер, шапка.';
  else if (temp <= 18) text += '\nСовет: лёгкая куртка, джинсы.';
  else if (temp <= 25) text += '\nСовет: футболка, лёгкие брюки.';
  else text += '\nСовет: лёгкая одежда, вода с собой.';
  return text;
}
function extractCity(text) {
  let cleaned = text.toLowerCase().replace(/[?!.,;:]/g, ' ')
    .replace(/погод[ауы]?|прогноз|температур[ауы]?/gi, ' ')
    .replace(/\b(сейчас|сегодня|завтра|пожалуйста|мне|скажи|расскажи|какой|какая|какое|какие|будет|покажи|узнай|хочу|знать|можешь|подскажи|сколько|градусов|погода)\b/gi, ' ')
    .replace(/\s+/g, ' ').trim();
  let mV = cleaned.match(/\bв[о]?\s+([а-яёa-z\-]+(?:\s+[а-яёa-z\-]+)?)/i);
  if (mV && mV[1]) {
    let c = mV[1].trim().replace(/\s+(сейчас|сегодня|завтра|будет|на|в|и)$/i, '').trim();
    if (c.length >= 3) return c;
  }
  for (const ow of text.split(/\s+/)) {
    const clean = ow.replace(/[?!.,;:]/g, '');
    if (clean.length >= 3 && /^[А-ЯЁA-Z]/.test(clean)) return clean;
  }
  const words = cleaned.split(/\s+/).filter(w => w.length >= 3);
  if (words.length) return words[words.length - 1];
  return null;
}
function askGeo() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => resolve(null),
      { timeout: 5000, maximumAge: 600000 }
    );
  });
}
async function handleWeather(userText) {
  let city = extractCity(userText);
  let cityName = null, data = null;
  if (city) {
    const found = await findCity(city);
    if (found) {
      cityName = found.name + (found.country ? ', ' + found.country : '');
      data = await getWeatherByCoords(found.lat, found.lon);
    } else {
      return 'Не нашёл город "' + city + '". Попробуйте: "погода в Москве".';
    }
  } else {
    const coords = await askGeo();
    if (coords) {
      cityName = 'вашей локации';
      data = await getWeatherByCoords(coords.lat, coords.lon);
    } else {
      return 'Укажите город: например, "погода в Москве".';
    }
  }
  if (!data) return 'Не удалось получить данные.';
  return formatWeather(data, cityName);
}

/* ============================================================
   ЖИВОЙ ДВИЖОК
   ============================================================ */
const dialogHistory = [];
const recentReplies = [];

function pickUnique(arr) {
  const fresh = arr.filter(r => !recentReplies.includes(r));
  const pool = fresh.length ? fresh : arr;
  const r = pool[Math.floor(Math.random() * pool.length)];
  recentReplies.push(r);
  if (recentReplies.length > 6) recentReplies.shift();
  return r;
}

function smartFallback(text) {
  const lower = text.toLowerCase().trim();
  if (lower.length < 4) return pickUnique(['Уточните пожалуйста.', 'Расскажите подробнее.']);
  const isQuestion = /\?$/.test(lower) || /^(что|где|когда|почему|зачем|как|кто|какой|какая|какое|какие|сколько|можно|правда|есть|стоит|помоги|расскажи)\b/i.test(lower);
  if (isQuestion) {
    return pickUnique([
      'Уточните — что именно вас интересует?',
      'Опишите подробнее — тогда дам развёрнутый ответ.',
      'Задайте вопрос конкретнее — помогу.',
      'Расскажите детали — подскажу по существу.'
    ]);
  }
  return pickUnique([
    'Понял вас. Расскажите подробнее.',
    'Слушаю. Что хотите обсудить?',
    'Продолжайте, я внимателен.',
    'Понимаю. Спросите конкретное.',
    'Хорошо. О чём бы вы хотели поговорить?'
  ]);
}

async function getReply(text) {
  const lower = text.toLowerCase();
  if (/погод|дожд|снег|жарко|холодно|прогноз|температур|градус|что надеть|зонт|на улице/i.test(lower)) {
    return await handleWeather(text);
  }
  const matches = [];
  for (const k of K) {
    for (const key of k.keys) {
      if (lower.includes(key)) matches.push({ k, key });
    }
  }
  if (matches.length) {
    matches.sort((a, b) => b.key.length - a.key.length);
    return pickUnique(matches[0].k.replies);
  }
  return smartFallback(text);
}

async function botReply(userText) {
  showTyping();
  await new Promise(r => setTimeout(r, 500 + Math.random() * 700));
  const reply = await getReply(userText);
  hideTyping();
  addMessage(reply, 'bot');
  speak(reply);
  dialogHistory.push({ user: userText, bot: reply });
  if (dialogHistory.length > 20) dialogHistory.shift();
}

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  inputEl.value = '';
  botReply(text);
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
