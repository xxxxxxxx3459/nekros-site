<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEKROS AWAKENING</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: 'Courier New', monospace; color: #00ff9d; cursor: crosshair;
    -webkit-tap-highlight-color: transparent;
  }
  #matrix { position: fixed; inset: 0; z-index: 1; }
  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,255,157,0.04) 0px, rgba(0,255,157,0.04) 1px, transparent 1px, transparent 3px);
    pointer-events: none; z-index: 20; animation: scanmove 8s linear infinite;
  }
  @keyframes scanmove { 0% { background-position: 0 0; } 100% { background-position: 0 100px; } }
  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
    pointer-events: none; z-index: 19;
  }
  #intro {
    position: fixed; inset: 0; background: #000; z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity 0.6s ease;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  #intro .intro-skull { width: 200px; height: 200px; filter: drop-shadow(0 0 40px #00ff9d); animation: introPulse 2s ease-in-out infinite; }
  @keyframes introPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 40px #00ff9d); }
    50% { transform: scale(1.06); filter: drop-shadow(0 0 70px #00ffea); }
  }
  #intro .intro-brand { margin-top: 40px; font-size: 20px; letter-spacing: 16px; color: #00ffea; text-shadow: 0 0 20px #00ffea; font-weight: bold; }
  #intro .intro-text { margin-top: 40px; font-size: 14px; letter-spacing: 8px; color: #00ff9d; text-shadow: 0 0 12px #00ff9d; animation: blink 1.4s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  #main {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
  }
  #main.show { opacity: 1; pointer-events: all; }
  .skull-center {
    position: absolute; top: 45%; left: 50%;
    transform: translate(-50%, -50%);
    width: 240px; height: 240px; pointer-events: none; z-index: 3;
    animation: skullPulse 3s ease-in-out infinite;
  }
  @keyframes skullPulse {
    0%, 100% { filter: drop-shadow(0 0 25px #00ff9d); transform: translate(-50%, -50%) scale(1); }
    50% { filter: drop-shadow(0 0 45px #00ffea); transform: translate(-50%, -50%) scale(1.03); }
  }
  .skull-center svg { width: 100%; height: 100%; }
  .glitch-layer { position: absolute; inset: 0; pointer-events: none; }
  .glitch-1 { animation: glitch1 2.5s infinite; mix-blend-mode: screen; }
  .glitch-2 { animation: glitch2 3.7s infinite; mix-blend-mode: screen; }
  @keyframes glitch1 {
    0%, 90%, 100% { transform: translate(0); opacity: 0; }
    92% { transform: translate(-8px, 3px); opacity: 1; filter: hue-rotate(180deg); }
    94% { transform: translate(6px, -4px); opacity: 1; }
    96% { transform: translate(-3px, 2px); opacity: 1; }
  }
  @keyframes glitch2 {
    0%, 85%, 100% { transform: translate(0); opacity: 0; }
    88% { transform: translate(7px, -3px); opacity: 1; filter: hue-rotate(-90deg); }
    91% { transform: translate(-5px, 5px); opacity: 1; }
    93% { transform: translate(3px, -2px); opacity: 1; }
  }
  .brand-title {
    position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
    font-size: 13px; letter-spacing: 10px; color: #00ffea;
    text-shadow: 0 0 15px #00ffea; font-weight: bold; z-index: 6; pointer-events: none;
  }
  .messages {
    position: absolute; inset: 0; bottom: 80px; top: 80px;
    overflow-y: auto; padding: 30px 20px 20px;
    display: flex; flex-direction: column; gap: 12px;
    z-index: 4; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .messages::-webkit-scrollbar { display: none; }
  .msg {
    max-width: 88%; padding: 10px 14px;
    font-size: 14px; line-height: 1.55; letter-spacing: 0.4px;
    animation: msgIn 0.35s ease; word-wrap: break-word;
    background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px);
    border-left: 2px solid #00ff9d;
    text-shadow: 0 0 8px rgba(0, 255, 157, 0.4);
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg.bot { align-self: flex-start; color: #b8ffd9; }
  .msg.user {
    align-self: flex-end; color: #a8fff5;
    border-left: none; border-right: 2px solid #00ffea;
    background: rgba(0, 20, 20, 0.6);
    text-shadow: 0 0 8px rgba(0, 255, 234, 0.4);
  }
  .msg .name { font-size: 9px; letter-spacing: 3px; opacity: 0.55; margin-bottom: 4px; color: #00ff9d; }
  .msg.typing { color: #00ff9d; opacity: 0.7; font-style: italic; }
  .input-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px 20px 24px;
    background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.6), transparent);
    display: flex; align-items: center; gap: 10px; z-index: 10;
  }
  .input-field {
    flex: 1; background: rgba(0, 20, 10, 0.5);
    border: none; border-bottom: 1px solid rgba(0, 255, 157, 0.4);
    outline: none; color: #00ffea; padding: 12px 6px;
    font-family: 'Courier New', monospace; font-size: 15px;
    letter-spacing: 1px; text-shadow: 0 0 6px rgba(0, 255, 234, 0.5);
    transition: border-color 0.3s;
  }
  .input-field:focus { border-bottom-color: #00ffea; }
  .input-field::placeholder { color: rgba(0, 255, 157, 0.35); letter-spacing: 2px; font-size: 13px; }
  .send-btn {
    background: transparent; border: none; color: #00ff9d;
    font-size: 22px; padding: 8px 12px; cursor: pointer;
    text-shadow: 0 0 10px #00ff9d; transition: all 0.2s; font-family: monospace;
  }
  .send-btn:active { color: #00ffea; text-shadow: 0 0 20px #00ffea; transform: scale(1.15); }
  .hud {
    position: fixed; font-size: 9px; letter-spacing: 2px;
    color: #00ff9d; opacity: 0.55; z-index: 6;
    pointer-events: none; text-shadow: 0 0 6px #00ff9d;
  }
  .hud-tl { top: 16px; left: 16px; }
  .hud-tr { top: 16px; right: 16px; text-align: right; }
  .hud-bl { bottom: 16px; left: 16px; }
  .hud-br { bottom: 16px; right: 16px; text-align: right; }
  .dot-live {
    display: inline-block; width: 6px; height: 6px; background: #ff3355;
    border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px #ff3355;
    animation: blink 1s infinite; vertical-align: middle;
  }
</style>

<script>
/* ============ МАТРИЦА ============ */
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let W, H, columns, drops;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  columns = Math.floor(W / 16);
  drops = Array(columns).fill(0).map(() => Math.random() * H);
}
resize();
window.addEventListener('resize', resize);
const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンABCDEF#$%&*<>/\\+=';
function drawMatrix() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = '16px monospace';
  for (let i = 0; i < drops.length; i++) {
    const c = chars[Math.floor(Math.random() * chars.length)];
    const x = i * 16, y = drops[i];
    if (Math.random() > 0.97) {
      ctx.fillStyle = '#aaffdd'; ctx.shadowBlur = 15; ctx.shadowColor = '#00ffea';
    } else {
      ctx.fillStyle = Math.random() > 0.85 ? '#00ffea' : '#00ff9d';
      ctx.shadowBlur = 8; ctx.shadowColor = '#00ff9d';
    }
    ctx.fillText(c, x, y);
    ctx.shadowBlur = 0;
    if (y > H && Math.random() > 0.97) drops[i] = 0;
    drops[i] += 16;
  }
}
setInterval(drawMatrix, 33);

setInterval(() => {
  const d = new Date();
  const t = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
  document.getElementById('clock').textContent = t;
}, 1000);

/* ============ ЗВУК ============ */
let audioCtx = null;
function startAmbient() {
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  const hum = audioCtx.createOscillator();
  hum.type = 'sawtooth'; hum.frequency.value = 55;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 180;
  const gain = audioCtx.createGain(); gain.gain.value = 0.025;
  hum.connect(filter).connect(gain).connect(audioCtx.destination);
  hum.start();
  const hum2 = audioCtx.createOscillator();
  hum2.type = 'sawtooth'; hum2.frequency.value = 55.4;
  const gain2 = audioCtx.createGain(); gain2.gain.value = 0.015;
  hum2.connect(filter).connect(gain2).connect(audioCtx.destination);
  hum2.start();
}

/* ============ ГОЛОС ============ */
let ruVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  ruVoice = voices.find(v => /ru/i.test(v.lang) && /yuri|pavel|dmitri|maxim|aleksandr/i.test(v.name))
         || voices.find(v => /ru/i.test(v.lang) && /male/i.test(v.name))
         || voices.find(v => /ru/i.test(v.lang))
         || voices[0];
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

function speak(text) {
  if (speechSynthesis.speaking) speechSynthesis.cancel();
  const parts = text.split(/(?<=[.!?])\s+/);
  let i = 0;
  function next() {
    if (i >= parts.length) return;
    const u = new SpeechSynthesisUtterance(parts[i]);
    u.lang = 'ru-RU';
    if (ruVoice) u.voice = ruVoice;
    u.pitch = 1.0;
    u.rate = 0.96;
    u.volume = 1.0;
    i++;
    u.onend = () => setTimeout(next, 180);
    u.onerror = () => setTimeout(next, 180);
    speechSynthesis.speak(u);
  }
  next();
}

/* ============ ЧАТ ============ */
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('chatInput');
const sendBtn = document.getElementById('chatSend');
const recentReplies = [];
function pickUnique(arr) {
  const fresh = arr.filter(r => !recentReplies.includes(r));
  const pool = fresh.length ? fresh : arr;
  const r = pool[Math.floor(Math.random() * pool.length)];
  recentReplies.push(r);
  if (recentReplies.length > 6) recentReplies.shift();
  return r;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const content = escapeHtml(text).replace(/\n/g, '<br>');
  div.innerHTML = `<div class="name">${who === 'bot' ? 'NEKROS' : 'ВЫ'}</div>${content}`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="name">NEKROS</div>обрабатываю запрос...';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

/* ============ ПОГОДА (Open-Meteo API) ============ */
const weatherCodes = {
  0: 'ясно', 1: 'преимущественно ясно', 2: 'переменная облачность', 3: 'пасмурно',
  45: 'туман', 48: 'изморозь',
  51: 'слабая морось', 53: 'морось', 55: 'сильная морось',
  56: 'лёгкий ледяной дождь', 57: 'ледяной дождь',
  61: 'слабый дождь', 63: 'дождь', 65: 'сильный дождь',
  66: 'лёгкий ледяной дождь', 67: 'сильный ледяной дождь',
  71: 'слабый снег', 73: 'снег', 75: 'сильный снег', 77: 'снежная крупа',
  80: 'слабый ливень', 81: 'ливень', 82: 'сильный ливень',
  85: 'снегопад', 86: 'сильный снегопад',
  95: 'гроза', 96: 'гроза с градом', 99: 'сильная гроза с градом'
};
function describeWeatherCode(code) { return weatherCodes[code] || 'неизвестно'; }

async function findCity(query) {
  try {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=ru&format=json`;
    const r = await fetch(url);
    const data = await r.json();
    if (data.results && data.results.length) {
      const c = data.results[0];
      return { name: c.name, country: c.country, lat: c.latitude, lon: c.longitude };
    }
  } catch (e) {}
  return null;
}

async function getWeatherByCoords(lat, lon) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code&timezone=auto&forecast_days=3`;
    const r = await fetch(url);
    return await r.json();
  } catch (e) { return null; }
}

function formatWeather(data, cityName) {
  if (!data || !data.current) return null;
  const c = data.current;
  const daily = data.daily;
  const desc = describeWeatherCode(c.weather_code);
  const temp = Math.round(c.temperature_2m);
  const feels = Math.round(c.apparent_temperature);
  const hum = c.relative_humidity_2m;
  const wind = Math.round(c.wind_speed_10m);
  const precip = c.precipitation;
  let text = `Погода в ${cityName}:\n`;
  text += `Сейчас ${temp}°C, ощущается как ${feels}°C. ${desc.charAt(0).toUpperCase() + desc.slice(1)}.\n`;
  text += `Влажность ${hum}%, ветер ${wind} км/ч`;
  if (precip > 0) text += `, осадки ${precip} мм`;
  text += '.\n';
  if (daily && daily.time && daily.time.length >= 2) {
    text += `\nПрогноз:\n`;
    for (let i = 0; i < Math.min(3, daily.time.length); i++) {
      const d = new Date(daily.time[i]);
      const dayName = i === 0 ? 'Сегодня' : i === 1 ? 'Завтра' : d.toLocaleDateString('ru-RU', { weekday: 'long' });
      const tmin = Math.round(daily.temperature_2m_min[i]);
      const tmax = Math.round(daily.temperature_2m_max[i]);
      const dDesc = describeWeatherCode(daily.weather_code[i]);
      text += `${dayName}: ${tmin}°C … ${tmax}°C, ${dDesc}.\n`;
    }
  }
  if (temp <= 0) text += `\nСовет: одевайтесь очень тепло — пуховик, шапка, перчатки, тёплая обувь.`;
  else if (temp <= 10) text += `\nСовет: куртка, свитер, шапка не помешает.`;
  else if (temp <= 18) text += `\nСовет: лёгкая куртка или ветровка, джинсы.`;
  else if (temp <= 25) text += `\nСовет: футболка, лёгкие брюки или шорты.`;
  else text += `\nСовет: лёгкая одежда, головной убор, вода с собой.`;
  if ((c.weather_code >= 51 && c.weather_code <= 67) || (c.weather_code >= 80 && c.weather_code <= 82)) {
    text += ` Не забудьте зонт.`;
  }
  if (c.weather_code >= 71 && c.weather_code <= 86) {
    text += ` Возьмите тёплую обувь.`;
  }
  return text;
}

function extractCity(text) {
  const patterns = [
    /погод[ауы]?\s+в\s+([а-яёa-z\-]+(?:\s+[а-яёa-z\-]+)?)/i,
    /погод[ауы]?\s+([а-яёa-z\-]+(?:\s+[а-яёa-z\-]+)?)/i,
    /в\s+([а-яёa-z\-]+)\s+погод/i,
    /как\s+погод[ауы]?\s+в\s+([а-яёa-z\-]+)/i
  ];
  for (const p of patterns) {
    const m = text.match(p);
    if (m && m[1]) {
      let city = m[1].trim();
      city = city.replace(/\b(сейчас|сегодня|завтра|пожалуйста|мне|скажи|расскажи|будет|какая|какой)\b/gi, '').trim();
      if (city.length > 1) return city;
    }
  }
  return null;
}

function askGeo() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => resolve(null),
      { timeout: 5000, maximumAge: 600000 }
    );
  });
}

async function handleWeather(userText) {
  let city = extractCity(userText);
  let cityName = null;
  let data = null;
  if (city) {
    const found = await findCity(city);
    if (found) {
      cityName = found.name + (found.country ? ', ' + found.country : '');
      data = await getWeatherByCoords(found.lat, found.lon);
    } else {
      return `Не нашёл город "${city}". Проверьте название.`;
    }
  } else {
    const coords = await askGeo();
    if (coords) {
      cityName = 'вашей локации';
      data = await getWeatherByCoords(coords.lat, coords.lon);
    } else {
      return 'Укажите город: например, "погода в Москве". Или разрешите доступ к геолокации в браузере.';
    }
  }
  if (!data) return 'Не удалось получить данные о погоде. Попробуйте ещё раз.';
  return formatWeather(data, cityName);
}

/* ============ УМНЫЙ FALLBACK ============ */
function smartFallback(text) {
  const lower = text.toLowerCase().trim();
  const words = lower.split(/\s+/);
  if (/\?$/.test(lower) || words.some(w => ['что','где','когда','почему','зачем','как','кто','какой','какая','какое','какие','сколько'].includes(w))) {
    return pickUnique([
      'Хороший вопрос. Уточните — что именно вас интересует? Могу дать советы по машинам, здоровью, учёбе, спорту, IT и другим темам.',
      'Если уточните вопрос — дам развёрнутый совет. Например: "какую машину купить до 1 млн" или "как научиться рисовать".',
      'Интересная тема. Расскажите подробнее — тогда отвечу по существу.',
      'Задайте вопрос конкретнее — и я подскажу.'
    ]);
  }
  return pickUnique([
    'Понял вас. Расскажите подробнее — как я могу помочь?',
    'Слушаю. Что вы хотите обсудить?',
    'Интересно. Продолжайте — я рядом.',
    'Понимаю. Спросите что-то конкретное, я постараюсь дать полезный совет.',
    'Хорошо. О чём бы вы хотели поговорить?',
    'Я внимательно слушаю. Что дальше?'
  ]);
}

/* ============ ГЛАВНАЯ ЛОГИКА ОТВЕТА ============ */
async function getReply(text) {
  const lower = text.toLowerCase();

  // ПРИОРИТЕТ — ПОГОДА
  if (/погод|дожд|снег|жарко|холодно|прогноз|температур|градус|что надеть|зонт|на улице/i.test(lower)) {
    return await handleWeather(text);
  }

  const matches = [];
  for (const k of K) {
    for (const key of k.keys) {
      if (lower.includes(key)) matches.push({ k, key });
    }
  }
  if (matches.length) {
    matches.sort((a, b) => b.key.length - a.key.length);
    return pickUnique(matches[0].k.replies);
  }
  return smartFallback(text);
}

async function botReply(userText) {
  showTyping();
  const delay = 400 + Math.random() * 400;
  await new Promise(r => setTimeout(r, delay));
  const reply = await getReply(userText);
  hideTyping();
  addMessage(reply, 'bot');
  speak(reply);
}

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  inputEl.value = '';
  botReply(text);
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
